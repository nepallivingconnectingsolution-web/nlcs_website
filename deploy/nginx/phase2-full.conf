# PHASE 2 — paste this into the CRM's nginx.conf AFTER certbot has successfully
# issued certs for nlcsitservice.com and www.nlcsitservice.com (phase 1 ran first).
# This REPLACES the phase1-http-only.conf blocks — delete those before pasting
# this in. Matches the style of the existing sjcrm.nlcsitservice.com blocks
# already in that file; that block is untouched by any of this. See DEPLOY.md.
#
# NOTE: the API is served from THIS SAME domain under /api/ and /uploads/,
# not from a separate api.nlcsitservice.com subdomain — that subdomain's DNS
# got stuck propagating on Hostinger's side (see DEPLOY.md), so this routes
# around it using path-based routing on the domain that's already working.
# The client is built with no VITE_API_URL, so it calls relative /api paths,
# which land on this same origin — no CORS, no extra DNS/cert needed.

server {
    listen 80;
    server_name nlcsitservice.com www.nlcsitservice.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://nlcsitservice.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.nlcsitservice.com;

    ssl_certificate     /etc/letsencrypt/live/www.nlcsitservice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.nlcsitservice.com/privkey.pem;

    return 301 https://nlcsitservice.com$request_uri;
}

server {
    listen 443 ssl;
    server_name nlcsitservice.com;

    ssl_certificate     /etc/letsencrypt/live/nlcsitservice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nlcsitservice.com/privkey.pem;

    # Matches the 5MB image upload limit in server/middleware/upload.js, plus headroom.
    client_max_body_size 8m;

    # API + uploaded images — proxied to the nlcs-api container, same origin as the site.
    location /api/ {
        proxy_pass http://nlcs-api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://nlcs-api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else — the built React SPA.
    root /usr/share/nginx/html/nlcs;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
