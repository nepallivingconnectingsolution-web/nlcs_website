# PHASE 1 — paste this into the CRM's nginx.conf FIRST, before requesting certs.
# These are HTTP-only (port 80) blocks so certbot's webroot challenge can succeed
# for the new domains. No SSL directives here yet, since the certs don't exist
# until after this phase is applied and certbot has run. See DEPLOY.md.
# Once certs are issued, DELETE these blocks and paste phase2-full.conf instead.

server {
    listen 80;
    server_name nlcsitservice.com www.nlcsitservice.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'NLCS site: certificate setup in progress.';
        add_header Content-Type text/plain;
    }
}

server {
    listen 80;
    server_name api.nlcsitservice.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'NLCS API: certificate setup in progress.';
        add_header Content-Type text/plain;
    }
}
