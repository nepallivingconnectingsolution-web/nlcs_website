# PHASE 1 — paste this into the CRM's nginx.conf FIRST, before requesting certs.
# HTTP-only (port 80) block so certbot's webroot challenge can succeed for the
# new domain. No SSL directives here yet, since the cert doesn't exist until
# after this phase is applied and certbot has run. See DEPLOY.md.
# Once the cert is issued, DELETE this block and paste phase2-full.conf instead.
#
# No separate api.nlcsitservice.com block — that subdomain's DNS got stuck
# propagating, so the API is served from this same domain under /api/ instead
# (see phase2-full.conf). If api.'s DNS ever starts working, a block for it
# can be added back later, but it isn't needed for launch.

server {
    listen 80;
    server_name nlcsitservice.com www.nlcsitservice.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'NLCS site: certificate setup in progress.';
        add_header Content-Type text/plain;
    }
}
