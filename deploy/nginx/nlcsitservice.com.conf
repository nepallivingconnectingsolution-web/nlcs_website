# Static hosting for the built React SPA (client/dist).
# Install to /etc/nginx/sites-available/nlcsitservice.com.conf on the VPS,
# then: ln -s ../sites-available/nlcsitservice.com.conf /etc/nginx/sites-enabled/
# Get the cert first with: certbot --nginx -d nlcsitservice.com -d www.nlcsitservice.com

server {
    listen 80;
    listen [::]:80;
    server_name nlcsitservice.com www.nlcsitservice.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://nlcsitservice.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nlcsitservice.com;

    ssl_certificate     /etc/letsencrypt/live/nlcsitservice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nlcsitservice.com/privkey.pem;

    return 301 https://nlcsitservice.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nlcsitservice.com;

    ssl_certificate     /etc/letsencrypt/live/nlcsitservice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nlcsitservice.com/privkey.pem;

    root /var/www/nlcsitservice.com/client/dist;
    index index.html;

    # SPA fallback — let React Router handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames from the Vite build can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
