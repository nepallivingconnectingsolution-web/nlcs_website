# Reverse proxy for the Node/Express API.
# Install to /etc/nginx/sites-available/api.nlcsitservice.com.conf on the VPS,
# then: ln -s ../sites-available/api.nlcsitservice.com.conf /etc/nginx/sites-enabled/
# Get the cert first with: certbot --nginx -d api.nlcsitservice.com

server {
    listen 80;
    listen [::]:80;
    server_name api.nlcsitservice.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.nlcsitservice.com;

    ssl_certificate     /etc/letsencrypt/live/api.nlcsitservice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nlcsitservice.com/privkey.pem;

    # Matches the 5MB image upload limit in server/middleware/upload.js, plus headroom.
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
